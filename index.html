            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Correção de erros do Windows" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Programas, Office e drivers" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Backup e transferência de arquivos" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Microsoft 365, Outlook e Teams" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Suporte remoto para contadores" } },

          "https://www.linkedin.com/in/ronael-moura",
          "https://www.instagram.com/ronas_tech/"

          "availableLanguage": "Portuguese"

    <script id="home-faq-structured-data" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Como funciona o acesso remoto?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Se o atendimento remoto for indicado, você recebe pelo WhatsApp a orientação para iniciar uma sessão. O acesso só começa com a sua autorização, você acompanha a tela e pode encerrar quando quiser."
            }
          },
          {
            "@type": "Question",
            "name": "É seguro dar acesso ao meu computador?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. Você vê a tela inteira durante o atendimento, aprova cada etapa e pode encerrar o acesso quando quiser."
            }
          },
          {
            "@type": "Question",
            "name": "Quanto custa o atendimento?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A triagem inicial pelo WhatsApp é gratuita. Quando for necessário acessar o computador, o diagnóstico técnico começa em R$ 29; os demais serviços e o valor final são confirmados para sua aprovação antes do trabalho começar. O suporte recorrente para empresas começa em R$ 289 por mês."
            }
          }
        ]
      }
